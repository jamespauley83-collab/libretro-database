services:
  web:
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - "3000:3000"
    command: ["python", "app.py"]
    environment:
      - PORT=3000
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
